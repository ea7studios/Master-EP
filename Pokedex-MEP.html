<!DOCTYPE html>
<html>
   <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Master Electronic Pokedex</title>
       <link rel="stylesheet" href="pokedex-mep.css">
   </head>
   <body>
       <header>
           <h1>Pokedex</h1>
       </header>
       <main>
           <div>
               <section>
                   <h2>Kanto</h2>
                   <img>
                   <button class='pokedexes'>
                       <label>Show Pokedexes</label>
                   </button>
                   <span id='pkmn-rb'>
                       <a href="Kanto/red-blue-pokedex.html">Red and Blue</a>
                    </span>
                    <span id="pkmn-yellow">
                       <a href="Kanto/yellow-pokedex.html">Yellow</a>
                    </span>
               </section>
               <section>
                  <h2>Johto</h2>
                  <img>
                  <button class='pokedexes'>
                     <label>Show Pokedexes</label>
                  </button>
                  <span id='pkmn-gs'>
                     <a href="Johto/gold-pokedex.html">Gold</a> and <a href="Johto/silver-pokedex.html">Silver</a>
                  </span>
                  <span id='pkmn-crystal'>
                     <a href="Johto/crystal-pokedex.html">Crystal</a>
                  </span>  
               </section>
               <section>
                  <h2>Hoenn</h2>
                  <img>
                  <button class='pokedexes'>
                     <label>Show Pokedexes</label>
                  </button>
                  <span id='pkmn-rs'>
                     <a>Ruby and Sapphire</a>
                  </span>
                  <span id='pkmn-emerald'>
                     <a>Emerald</a>
                  </span>
                  <span id='pkmn-frlg'>
                     <a>FireRed and LeafGreen</a>
                  </span>
               </section>
               <section>
                  <h2>Sinnoh</h2>
                  <img>
                  <button class='pokedexes'>
                     <label>Show Pokedexes</label>
                  </button>
                  <span id='pkmn-dp'>
                     <a>Diamond and Pearl</a>
                  </span>
                  <span id='pkmn-platinum'>
                     <a>Platinum</a>
                  </span>
                  <span id='pkmn-hgss'>
                     <a>HeartGold and SoulSilver</a>
                  </span>  
               </section>
               <section>
                  <h2>Unova</h2>
                  <img>
                  <button class='pokedexes'>
                     <label>Show Pokedexes</label>
                  </button>
                  <span id="pkmn-bw">
                     <a>Black and White</a>
                  </span>
                  <span id="pkmn-b2w2">
                     <a>Black 2 and White 2</a>
                  </span>
               </section>

</html>
